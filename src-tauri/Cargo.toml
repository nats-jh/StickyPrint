[package]
name = "stickyprint"
version = "1.0.2+1"
description = "StickyPrint - 포스트잇 인쇄 도우미"
authors = ["kangjoonhyuk"]
license = "MIT"
repository = "https://github.com/nats-jh/StickyPrint"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stickyprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
semver = "1"

# 인쇄 창 없이 바로 인쇄, 프린터 목록 (tauri 가 쓰는 것과 같은 버전)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Storage_Xps"] }
